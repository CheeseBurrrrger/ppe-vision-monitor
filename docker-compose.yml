services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SCREENSHOTS_DIR: /data/violations/screenshots
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      CV_SERVICE_KEY: ${CV_SERVICE_KEY}
    volumes:
      - ${CV_OUTPUT_DIR:-./core/inference_output}:/data:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_HTTPS_PORT:-8443}:443"
    depends_on:
      - backend
    restart: unless-stopped

  core:
    build:
      context: .
      dockerfile: core/Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
      CV_SERVICE_KEY: ${CV_SERVICE_KEY}
      WS_PORT: 8765
      MODEL_PATH: ${MODEL_PATH:-/app/model/best_deva.pt}
    expose:
      - "8765"
    volumes:
      - ${CV_OUTPUT_DIR:-./core/inference_output}:/app/core/inference_output
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
